<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="tealGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad1)" />
  <rect width="800" height="450" fill="none" stroke="#1f2937" stroke-width="1" />

  <!-- Grid overlay -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Title Badge -->
  <rect x="50" y="40" width="180" height="28" rx="14" fill="#0d9488" fill-opacity="0.15" stroke="#0d9488" stroke-width="1" />
  <text x="140" y="58" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="middle" letter-spacing="1">AUTOMATION WORKFLOW</text>

  <!-- Connecting Workflow Line -->
  <path d="M 120 225 L 260 225 L 400 225 L 540 225 L 680 225" stroke="#14b8a6" stroke-width="3" stroke-dasharray="6,4" opacity="0.6" filter="url(#glow1)" />

  <!-- Node 1: Webhook Trigger -->
  <g transform="translate(70, 175)">
    <rect width="100" height="100" rx="12" fill="#162032" stroke="#0d9488" stroke-width="1.5" />
    <circle cx="50" cy="38" r="18" fill="#0d9488" fill-opacity="0.2" />
    <path d="M42 38 L48 44 L58 32" stroke="#2dd4bf" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <text x="50" y="72" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" fill="#f8fafc" text-anchor="middle">Webhook</text>
    <text x="50" y="86" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Trigger Ingest</text>
  </g>

  <!-- Node 2: JSON Parser -->
  <g transform="translate(210, 175)">
    <rect width="100" height="100" rx="12" fill="#162032" stroke="#334155" stroke-width="1.5" />
    <circle cx="50" cy="38" r="18" fill="#334155" fill-opacity="0.4" />
    <text x="50" y="44" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle">{ ; }</text>
    <text x="50" y="72" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" fill="#f8fafc" text-anchor="middle">JSON Parse</text>
    <text x="50" y="86" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Payload Clean</text>
  </g>

  <!-- Node 3: AI Agent Decision -->
  <g transform="translate(350, 160)">
    <rect width="110" height="130" rx="14" fill="#162032" stroke="#14b8a6" stroke-width="2" filter="url(#glow1)" />
    <circle cx="55" cy="45" r="22" fill="#0d9488" fill-opacity="0.3" />
    <path d="M45 45 C45 38 65 38 65 45 C65 52 45 52 45 45 Z" stroke="#2dd4bf" stroke-width="2" fill="none" />
    <circle cx="55" cy="45" r="4" fill="#2dd4bf" />
    <text x="55" y="85" font-family="'Poppins', sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">AI Agent</text>
    <text x="55" y="100" font-family="'Inter', sans-serif" font-size="9" fill="#2dd4bf" text-anchor="middle">Intent &amp; Routing</text>
    <text x="55" y="115" font-family="'Inter', sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">LLM Evaluation</text>
  </g>

  <!-- Node 4: n8n Execution Logic -->
  <g transform="translate(490, 175)">
    <rect width="100" height="100" rx="12" fill="#162032" stroke="#334155" stroke-width="1.5" />
    <circle cx="50" cy="38" r="18" fill="#f43f5e" fill-opacity="0.2" />
    <path d="M42 38 H58 M50 30 V46" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round" />
    <text x="50" y="72" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" fill="#f8fafc" text-anchor="middle">n8n Branch</text>
    <text x="50" y="86" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Conditional Action</text>
  </g>

  <!-- Node 5: Output Action -->
  <g transform="translate(630, 175)">
    <rect width="100" height="100" rx="12" fill="#162032" stroke="#0d9488" stroke-width="1.5" />
    <circle cx="50" cy="38" r="18" fill="#0d9488" fill-opacity="0.2" />
    <path d="M42 42 L58 34 L50 48 Z" stroke="#2dd4bf" stroke-width="2" fill="none" stroke-linejoin="round" />
    <text x="50" y="72" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" fill="#f8fafc" text-anchor="middle">Dispatch</text>
    <text x="50" y="86" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Sheet &amp; Alerts</text>
  </g>

  <!-- Subtle metrics indicators -->
  <g transform="translate(50, 380)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="12" fill="#64748b">Latency: <tspan fill="#2dd4bf" font-weight="600">&lt; 2.5s</tspan></text>
    <text x="180" y="0" font-family="'Inter', sans-serif" font-size="12" fill="#64748b">Reliability: <tspan fill="#2dd4bf" font-weight="600">99.9% Uptime</tspan></text>
    <text x="360" y="0" font-family="'Inter', sans-serif" font-size="12" fill="#64748b">Execution Mode: <tspan fill="#f8fafc" font-weight="600">Event-Driven Asynchronous</tspan></text>
  </g>
</svg>
