<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad4)" />
  <rect width="800" height="450" fill="none" stroke="#1f2937" stroke-width="1" />

  <!-- Badge -->
  <rect x="50" y="35" width="230" height="28" rx="14" fill="#0d9488" fill-opacity="0.15" stroke="#0d9488" stroke-width="1" />
  <text x="165" y="53" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="middle" letter-spacing="1">PREDICTIVE ML &amp; MODELING</text>

  <!-- Left: ROC-AUC / Model Evaluation Curve -->
  <g transform="translate(50, 90)">
    <rect width="330" height="260" rx="10" fill="#162032" stroke="#334155" stroke-width="1" />
    <text x="20" y="30" font-family="'Poppins', sans-serif" font-size="12" font-weight="600" fill="#f8fafc">ROC-AUC Curve &amp; Calibration</text>

    <!-- Axes -->
    <line x1="50" y1="60" x2="50" y2="210" stroke="#475569" stroke-width="1" />
    <line x1="50" y1="210" x2="290" y2="210" stroke="#475569" stroke-width="1" />
    <text x="170" y="235" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">False Positive Rate</text>
    <text x="25" y="135" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8" transform="rotate(-90 25 135)" text-anchor="middle">True Positive Rate</text>

    <!-- Random Guess Baseline -->
    <line x1="50" y1="210" x2="290" y2="60" stroke="#475569" stroke-width="1" stroke-dasharray="3,3" />

    <!-- ROC Curve -->
    <path d="M 50 210 Q 70 80 140 70 T 290 60" fill="none" stroke="#2dd4bf" stroke-width="3" />
    <!-- AUC Fill -->
    <path d="M 50 210 Q 70 80 140 70 T 290 60 L 290 210 Z" fill="#0d9488" fill-opacity="0.15" />

    <rect x="180" y="150" width="95" height="40" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="227" y="166" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">AUC Score</text>
    <text x="227" y="182" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#2dd4bf" text-anchor="middle">0.932</text>
  </g>

  <!-- Right: Feature Importance (Scikit-Learn Interpretability) -->
  <g transform="translate(410, 90)">
    <rect width="340" height="260" rx="10" fill="#162032" stroke="#334155" stroke-width="1" />
    <text x="20" y="30" font-family="'Poppins', sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Feature Importance &amp; Weight Factors</text>

    <!-- Feature 1 -->
    <text x="20" y="70" font-family="'Inter', sans-serif" font-size="11" fill="#cbd5e1">Historical Variance</text>
    <rect x="145" y="58" width="140" height="14" rx="4" fill="#0d9488" />
    <text x="295" y="70" font-family="'JetBrains Mono', monospace" font-size="10" fill="#2dd4bf">+0.38</text>

    <!-- Feature 2 -->
    <text x="20" y="105" font-family="'Inter', sans-serif" font-size="11" fill="#cbd5e1">Cycle Recency</text>
    <rect x="145" y="93" width="115" height="14" rx="4" fill="#14b8a6" />
    <text x="295" y="105" font-family="'JetBrains Mono', monospace" font-size="10" fill="#2dd4bf">+0.29</text>

    <!-- Feature 3 -->
    <text x="20" y="140" font-family="'Inter', sans-serif" font-size="11" fill="#cbd5e1">Interaction Frequency</text>
    <rect x="145" y="128" width="85" height="14" rx="4" fill="#06b6d4" />
    <text x="295" y="140" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38bdf8">+0.19</text>

    <!-- Feature 4 -->
    <text x="20" y="175" font-family="'Inter', sans-serif" font-size="11" fill="#cbd5e1">Load Intensity</text>
    <rect x="145" y="163" width="55" height="14" rx="4" fill="#334155" />
    <text x="295" y="175" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">+0.11</text>

    <!-- Feature 5 -->
    <text x="20" y="210" font-family="'Inter', sans-serif" font-size="11" fill="#cbd5e1">Channel Offset</text>
    <rect x="145" y="198" width="30" height="14" rx="4" fill="#1e293b" />
    <text x="295" y="210" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b">+0.04</text>

    <text x="20" y="244" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8">Model: Gradient Boosting Classifier &amp; Random Forest</text>
  </g>

  <!-- Bottom Details -->
  <g transform="translate(50, 395)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="12" fill="#64748b">Tech: <tspan fill="#f8fafc" font-weight="600">Scikit-learn · Pandas · NumPy · Cross-Validation</tspan></text>
    <text x="450" y="0" font-family="'Inter', sans-serif" font-size="12" fill="#64748b">Objective: <tspan fill="#2dd4bf" font-weight="600">Practical Decision Support</tspan></text>
  </g>
</svg>
