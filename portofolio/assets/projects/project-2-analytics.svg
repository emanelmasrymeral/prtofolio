<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="chartGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad2)" />
  <rect width="800" height="450" fill="none" stroke="#1f2937" stroke-width="1" />

  <!-- Badge -->
  <rect x="50" y="40" width="170" height="28" rx="14" fill="#0d9488" fill-opacity="0.15" stroke="#0d9488" stroke-width="1" />
  <text x="135" y="58" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="middle" letter-spacing="1">DATA ANALYTICS &amp; EDA</text>

  <!-- Left: Data Frame / Data Cleaning Table Visual -->
  <g transform="translate(50, 100)">
    <rect width="320" height="230" rx="10" fill="#162032" stroke="#334155" stroke-width="1" />
    <!-- Table Header -->
    <rect width="320" height="38" rx="10" fill="#1e293b" />
    <text x="20" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#94a3b8">df.clean_records()</text>
    <circle cx="280" cy="19" r="4" fill="#10b981" />
    <circle cx="295" cy="19" r="4" fill="#38bdf8" />

    <!-- Table Rows -->
    <g font-family="'JetBrains Mono', monospace" font-size="10" fill="#cbd5e1">
      <line x1="0" y1="75" x2="320" y2="75" stroke="#334155" stroke-width="0.7" />
      <text x="20" y="60" fill="#38bdf8">ID</text>
      <text x="70" y="60" fill="#38bdf8">METRIC</text>
      <text x="170" y="60" fill="#38bdf8">Z-SCORE</text>
      <text x="250" y="60" fill="#38bdf8">STATUS</text>

      <text x="20" y="98">01</text>
      <text x="70" y="98">Throughput</text>
      <text x="170" y="98">+1.42</text>
      <text x="250" y="98" fill="#10b981">Valid</text>
      <line x1="0" y1="113" x2="320" y2="113" stroke="#334155" stroke-width="0.7" />

      <text x="20" y="136">02</text>
      <text x="70" y="136">Retention</text>
      <text x="170" y="136">+0.88</text>
      <text x="250" y="136" fill="#10b981">Valid</text>
      <line x1="0" y1="151" x2="320" y2="151" stroke="#334155" stroke-width="0.7" />

      <text x="20" y="174">03</text>
      <text x="70" y="174">Variance</text>
      <text x="170" y="174">-0.31</text>
      <text x="250" y="174" fill="#10b981">Valid</text>
      <line x1="0" y1="189" x2="320" y2="189" stroke="#334155" stroke-width="0.7" />

      <text x="20" y="212">04</text>
      <text x="70" y="212">CycleTime</text>
      <text x="170" y="212">+2.15</text>
      <text x="250" y="212" fill="#f59e0b">Anomaly</text>
    </g>
  </g>

  <!-- Right: Statistical Distribution Curve & Histogram -->
  <g transform="translate(410, 100)">
    <rect width="340" height="230" rx="10" fill="#162032" stroke="#334155" stroke-width="1" />
    <text x="20" y="30" font-family="'Poppins', sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Statistical Distribution &amp; Trend Insights</text>

    <!-- Bars -->
    <rect x="35" y="180" width="22" height="30" fill="#1e293b" rx="2" />
    <rect x="65" y="150" width="22" height="60" fill="#334155" rx="2" />
    <rect x="95" y="115" width="22" height="95" fill="#0d9488" rx="2" fill-opacity="0.5" />
    <rect x="125" y="80" width="22" height="130" fill="#0d9488" rx="2" fill-opacity="0.8" />
    <rect x="155" y="65" width="22" height="145" fill="#14b8a6" rx="2" />
    <rect x="185" y="85" width="22" height="125" fill="#0d9488" rx="2" fill-opacity="0.8" />
    <rect x="215" y="125" width="22" height="85" fill="#0d9488" rx="2" fill-opacity="0.5" />
    <rect x="245" y="165" width="22" height="45" fill="#334155" rx="2" />
    <rect x="275" y="185" width="22" height="25" fill="#1e293b" rx="2" />

    <!-- Gaussian Curve -->
    <path d="M 30 200 Q 110 195 140 100 T 166 65 T 192 100 T 290 200" fill="none" stroke="#2dd4bf" stroke-width="3" />

    <line x1="25" y1="210" x2="315" y2="210" stroke="#475569" stroke-width="1" />
  </g>

  <!-- Bottom Details -->
  <g transform="translate(50, 375)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="12" fill="#64748b">Pipeline: <tspan fill="#f8fafc" font-weight="600">Pandas + NumPy + SQL Cleaning</tspan></text>
    <text x="320" y="0" font-family="'Inter', sans-serif" font-size="12" fill="#64748b">Quality Score: <tspan fill="#2dd4bf" font-weight="600">99.4% Verified</tspan></text>
    <text x="560" y="0" font-family="'Inter', sans-serif" font-size="12" fill="#64748b">Output: <tspan fill="#38bdf8" font-weight="600">Actionable Insights</tspan></text>
  </g>
</svg>
