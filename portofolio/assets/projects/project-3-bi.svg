<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="pbiYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad3)" />
  <rect width="800" height="450" fill="none" stroke="#1f2937" stroke-width="1" />

  <!-- Badge -->
  <rect x="50" y="35" width="220" height="28" rx="14" fill="#0d9488" fill-opacity="0.15" stroke="#0d9488" stroke-width="1" />
  <text x="160" y="53" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="middle" letter-spacing="1">POWER BI &amp; DAX MODELING</text>

  <!-- Dashboard Top KPI Cards -->
  <g transform="translate(50, 85)">
    <!-- KPI 1 -->
    <rect x="0" y="0" width="160" height="75" rx="8" fill="#162032" stroke="#334155" stroke-width="1" />
    <text x="15" y="24" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Active KPIs Tracked</text>
    <text x="15" y="54" font-family="'Poppins', sans-serif" font-size="22" font-weight="700" fill="#f8fafc">24 Core</text>
    <text x="100" y="52" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#10b981">+18.4%</text>

    <!-- KPI 2 -->
    <rect x="180" y="0" width="160" height="75" rx="8" fill="#162032" stroke="#334155" stroke-width="1" />
    <text x="195" y="24" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Cycle Efficiency</text>
    <text x="195" y="54" font-family="'Poppins', sans-serif" font-size="22" font-weight="700" fill="#2dd4bf">94.8%</text>
    <text x="280" y="52" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#10b981">Optimal</text>

    <!-- KPI 3 -->
    <rect x="360" y="0" width="160" height="75" rx="8" fill="#162032" stroke="#334155" stroke-width="1" />
    <text x="375" y="24" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Data Latency</text>
    <text x="375" y="54" font-family="'Poppins', sans-serif" font-size="22" font-weight="700" fill="#f8fafc">Realtime</text>
    <text x="460" y="52" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#38bdf8">Sync</text>

    <!-- KPI 4 -->
    <rect x="540" y="0" width="160" height="75" rx="8" fill="#162032" stroke="#334155" stroke-width="1" />
    <text x="555" y="24" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Data Architecture</text>
    <text x="555" y="54" font-family="'Poppins', sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Star Schema</text>
  </g>

  <!-- Left Chart: Multi-Period Trend Line -->
  <g transform="translate(50, 180)">
    <rect width="420" height="180" rx="10" fill="#162032" stroke="#334155" stroke-width="1" />
    <text x="20" y="28" font-family="'Poppins', sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Multi-Period Trend Analysis (DAX Measures)</text>
    <!-- Axis lines -->
    <line x1="40" y1="50" x2="40" y2="150" stroke="#334155" stroke-width="1" />
    <line x1="40" y1="150" x2="390" y2="150" stroke="#334155" stroke-width="1" />

    <!-- Trend line 1: Target -->
    <path d="M 40 130 L 95 110 L 155 115 L 215 90 L 275 80 L 335 60 L 385 45" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round" />
    <!-- Trend line 2: Actual -->
    <path d="M 40 145 L 95 135 L 155 120 L 215 110 L 275 95 L 335 75 L 385 55" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" />

    <!-- Data markers -->
    <circle cx="385" cy="45" r="4" fill="#2dd4bf" />
    <circle cx="335" cy="60" r="4" fill="#2dd4bf" />
  </g>

  <!-- Right Chart: Category Breakdown Donut / Bars -->
  <g transform="translate(490, 180)">
    <rect width="260" height="180" rx="10" fill="#162032" stroke="#334155" stroke-width="1" />
    <text x="20" y="28" font-family="'Poppins', sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Category Slicers &amp; Splits</text>

    <!-- Bars -->
    <text x="20" y="65" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">Operations</text>
    <rect x="95" y="55" width="130" height="12" rx="4" fill="#0d9488" />
    <text x="235" y="65" font-family="'JetBrains Mono', monospace" font-size="10" fill="#f8fafc">44%</text>

    <text x="20" y="95" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">Logistics</text>
    <rect x="95" y="85" width="90" height="12" rx="4" fill="#14b8a6" />
    <text x="235" y="95" font-family="'JetBrains Mono', monospace" font-size="10" fill="#f8fafc">28%</text>

    <text x="20" y="125" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">Resource</text>
    <rect x="95" y="115" width="60" height="12" rx="4" fill="#06b6d4" />
    <text x="235" y="125" font-family="'JetBrains Mono', monospace" font-size="10" fill="#f8fafc">18%</text>

    <text x="20" y="155" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">Variance</text>
    <rect x="95" y="145" width="30" height="12" rx="4" fill="#64748b" />
    <text x="235" y="155" font-family="'JetBrains Mono', monospace" font-size="10" fill="#f8fafc">10%</text>
  </g>

  <!-- Bottom Details -->
  <g transform="translate(50, 400)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="12" fill="#64748b">Tech: <tspan fill="#f8fafc" font-weight="600">Power BI · DAX · Star Schema Modeling</tspan></text>
    <text x="380" y="0" font-family="'Inter', sans-serif" font-size="12" fill="#64748b">Target: <tspan fill="#2dd4bf" font-weight="600">Executive Decision Support</tspan></text>
  </g>
</svg>
